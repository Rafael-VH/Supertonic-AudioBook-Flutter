name: supertonic_audiobook
description: "Lee archivos `.md`, los limpia, los segmenta y los convierte en audios con el motor [Supertonic 3](https://huggingface.co/spaces/Supertone/supertonic-3) (TTS on-device basado en ONNX Runtime), con voces sintéticas en 31 idiomas + auto. Sin nube. Sin API. Sin GPU."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: ^1.8.3
  path_provider: ^2.1.1
  just_audio: ^0.10.5
  logger: ^2.0.2
  flutter_riverpod: 3.4.2
  intl: 0.20.2
  dio: ^5.11.0
  crypto: ^3.0.6
  file_picker: ^11.0.3
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: any
  ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0

flutter:

  uses-material-design: true
