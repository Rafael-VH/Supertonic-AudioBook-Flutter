<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__ · Diagramas</title>
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --fondo: #f4f6f8;
    --barra: #ffffff;
    --borde: #e3e7ec;
    --texto: #131820;
    --texto-suave: #5c6674;
    --acento: #0d6e63;
    --acento-texto: #ffffff;
  }
  :root[data-theme="dark"] {
    --fondo: #0d1117;
    --barra: #161b22;
    --borde: #272e38;
    --texto: #e6edf5;
    --texto-suave: #9aa6b4;
    --acento: #2dd4bf;
    --acento-texto: #06231f;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--fondo);
    color: var(--texto);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .barra {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .5rem clamp(.75rem, 2vw, 1.25rem);
    background: var(--barra);
    border-bottom: 1px solid var(--borde);
  }

  .volver {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .42rem .8rem;
    border: 1px solid var(--borde);
    border-radius: 9px;
    background: var(--fondo);
    color: var(--texto);
    font-weight: 600;
    font-size: .88rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .volver:hover { border-color: var(--acento); color: var(--acento); }

  .titulo {
    flex: 1 1 auto;
    min-width: 0;
    padding-left: .25rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tipo {
    flex: 0 0 auto;
    padding: .18rem .5rem;
    border-radius: 999px;
    border: 1px solid var(--borde);
    background: var(--fondo);
    color: var(--texto-suave);
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .accion {
    flex: 0 0 auto;
    color: var(--texto-suave);
    font-size: .84rem;
    text-decoration: none;
    white-space: nowrap;
  }
  .accion:hover { color: var(--acento); text-decoration: underline; }

  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  .lienzo {
    flex: 1 1 auto;
    width: 100%;
    border: 0;
    background: var(--fondo);
  }

  @media (max-width: 620px) {
    .titulo { display: none; }
    .accion { display: none; }
  }
</style>
</head>
<body>
  <header class="barra">
    <a class="volver" href="../../index.html">&larr; Volver a los diagramas</a>
    <span class="titulo">__TITULO__</span>
    <span class="tipo">__TIPO__</span>
    <a class="accion" href="__ESPECIFICACION__">Especificación (JSON)</a>
  </header>
  <iframe class="lienzo" src="__DIAGRAMA__" title="__TITULO__" loading="eager"></iframe>
</body>
</html>
